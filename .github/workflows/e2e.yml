name: e2e

# NOT a PR gate, on purpose:
#  - 22 of the specs WRITE to apitest, a shared staging DB (they create courses, groups
#    — capped at 3/day —, upload files, buy courses). Running that on every PR poisons
#    the data and makes two concurrent PRs fight each other.
#  - apitest is a self-hosted box behind a Cloudflare tunnel that has been down for a
#    full day before, so a PR gate would go red for infra reasons, not code reasons.
#  - PRs from forks never receive secrets.
#  - ~450 test runs with 240-300s timeouts in the AI specs is far too slow to block merges.
# So: nightly for the part that needs no credentials, and manual for everything else.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke = 2 spec không cần backend/mật khẩu · full = cả suite (cần secrets, GHI vào apitest)"
        type: choice
        options: [smoke, full]
        default: smoke
  schedule:
    # 01:00 giờ VN, chỉ chạy smoke (xem bước dưới) — không đụng dữ liệu staging
    - cron: "0 18 * * *"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # package-lock.json is generated on Windows and records ONLY win32 native binaries
      # (npm/cli#4828). Exactly nine families are affected — verified by reading the
      # lockfile: rollup, esbuild, @tailwindcss/oxide, lightningcss, @parcel/watcher,
      # @swc/core, @napi-rs/canvas, @unrs/resolver, sharp. Each is installed at the SAME
      # version npm ci just pinned, so nothing drifts.
      #
      # Dropping the lockfile and running plain `npm install` was tried first and is
      # wrong: it resolved a newer @heroui/react whose RadioFieldRenderProps no longer
      # carries `isFocusVisible`, so `next build` failed type-check on code that is fine.
      # A CI job that silently upgrades dependencies reports the wrong thing.
      - name: Add the linux native binaries the Windows lockfile omits
        run: |
          add() {
            version=$(node -p "try{require('$2/package.json').version}catch(e){try{require('next-intl/node_modules/$2/package.json').version}catch(e2){''}}")
            if [ -n "$version" ]; then
              npm install --no-save --no-audit --no-fund "$1@$version"
            else
              echo "bỏ qua $1 — không tìm thấy $2 trong node_modules"
            fi
          }
          add @rollup/rollup-linux-x64-gnu rollup
          add @esbuild/linux-x64 esbuild
          add @tailwindcss/oxide-linux-x64-gnu @tailwindcss/oxide
          add lightningcss-linux-x64-gnu lightningcss
          add @parcel/watcher-linux-x64-glibc @parcel/watcher
          add @swc/core-linux-x64-gnu @swc/core
          add @napi-rs/canvas-linux-x64-gnu @napi-rs/canvas
          add @unrs/resolver-binding-linux-x64-gnu @unrs/resolver
          add sharp sharp

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # only chromium: both projects (desktop + mobile) are Chromium devices
      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # A scheduled run always takes the credential-free path; `full` is a deliberate,
      # human-triggered choice because it writes to shared staging data.
      - name: Run Playwright
        env:
          FTES_TEST_PASSWORD: ${{ secrets.FTES_TEST_PASSWORD }}
          FTES_ADMIN_PASSWORD: ${{ secrets.FTES_ADMIN_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.scope }}" = "full" ]; then
            npx playwright test
          else
            npx playwright test e2e/blog-nav.spec.ts e2e/home-achievements-carousel.spec.ts
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
