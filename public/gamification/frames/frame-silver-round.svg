<?xml version="1.0" encoding="UTF-8"?>
<!--
  FTES circular avatar frame - pure vector, transparent centre, 512x512.
  Band inner edge r=191; nothing is drawn past r=248. Keep this header short:
  sharp/libvips only sniffs the first 1000 bytes for the <svg> tag.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     fill="none" role="img" aria-label="Khung viền bạc">
  <title>Khung viền bạc</title>
  <!--
    GEOMETRY. The avatar overlay renders the frame at 132% of the avatar, so the avatar's
    edge lands at r=193.9 and the band (inner edge r=191) laps it by ~3u: no hairline gap,
    and the ring never creeps over the face. Ornament budget r<=248 so nothing is clipped.

    ORNAMENT RULE - read this before adding anything.
    The ring is CLEAN all the way round; the ONLY ornament is one accent at the foot,
    a single bezel medallion. Nothing repeats around the circumference. A 512 box gives
    ~1200u of circumference against ~57u of radial room, so any motif repeated around the
    ring becomes small radial texture - and small radial texture always resolves to teeth:
    a gear or a bottle cap, never a wreath. Two passes proved that; the rejected-approach
    record is in openspec/changes/avatar-circular-shape-and-frames/proposal.md.
    Rank is carried by colour + band width. The foot accent is only the tiebreaker.
  -->
  <defs>
    <linearGradient id="band" x1="256" y1="6" x2="256" y2="506" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#E1E9F2"/>
      <stop offset="0.62" stop-color="#AEBCCE"/>
      <stop offset="1" stop-color="#78879C"/>
    </linearGradient>
    <linearGradient id="mount" x1="256" y1="452" x2="256" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9B8CA"/>
      <stop offset="1" stop-color="#6C7B90"/>
    </linearGradient>
  </defs>
  <g>
    <!-- polished band: dark outer rim, gradient body, dark inner rim -->
    <circle cx="256" cy="256" r="217.5" stroke="#586878" stroke-width="4" opacity=".55"/>
    <circle cx="256" cy="256" r="205" stroke="url(#band)" stroke-width="28"/>
    <circle cx="256" cy="256" r="192.5" stroke="#586878" stroke-width="3.5" opacity=".4"/>
    <!-- gloss: one long arc upper-left, one short arc lower-right -->
    <path d="M 64.32 201.04 A 199.4 199.4 0 0 1 235.16 57.69" stroke="#FFFFFF" stroke-width="9.52" stroke-linecap="round" opacity=".8"/>
    <path d="M 451.78 335.1 A 211.16 211.16 0 0 1 367.9 435.07" stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" opacity=".4"/>
    <!-- foot accent: ONE bezel medallion at 6 o'clock; see the ornament rule above -->
    <ellipse cx="256" cy="469" rx="25" ry="17" fill="url(#mount)" stroke="#586878" stroke-width="4"/>
    <path d="M 240.02 465.07 A 17 11.56 0 0 1 253.11 457.56" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".7"/>
    <circle cx="256" cy="469" r="10.2" fill="#DCE6F2" stroke="#7C8CA1" stroke-width="2"/><circle cx="252.6" cy="465.26" r="3.57" fill="#FFFFFF" opacity=".9"/>
  </g>
</svg>
