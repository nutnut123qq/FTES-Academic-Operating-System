<?xml version="1.0" encoding="UTF-8"?>
<!--
  FTES circular avatar frame - pure vector, transparent centre, 512x512.
  Band inner edge r=191; nothing is drawn past r=248. Keep this header short:
  sharp/libvips only sniffs the first 1000 bytes for the <svg> tag.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     fill="none" role="img" aria-label="Khung viền vàng">
  <title>Khung viền vàng</title>
  <!--
    GEOMETRY. The avatar overlay renders the frame at 132% of the avatar, so the avatar's
    edge lands at r=193.9 and the band (inner edge r=191) laps it by ~3u: no hairline gap,
    and the ring never creeps over the face. Ornament budget r<=248 so nothing is clipped.

    ORNAMENT RULE - read this before adding anything.
    The ring is CLEAN all the way round; the ONLY ornament is one accent at the foot,
    a single bezel medallion. Nothing repeats around the circumference. A 512 box gives
    ~1200u of circumference against ~57u of radial room, so any motif repeated around the
    ring becomes small radial texture - and small radial texture always resolves to teeth:
    a gear or a bottle cap, never a wreath. Two passes proved that; the rejected-approach
    record is in openspec/changes/avatar-circular-shape-and-frames/proposal.md.
    Rank is carried by colour + band width. The foot accent is only the tiebreaker.
  -->
  <defs>
    <linearGradient id="band" x1="256" y1="6" x2="256" y2="506" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4CE"/>
      <stop offset="0.28" stop-color="#F9D465"/>
      <stop offset="0.6" stop-color="#DDA023"/>
      <stop offset="1" stop-color="#A87016"/>
    </linearGradient>
    <linearGradient id="mount" x1="256" y1="452" x2="256" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8AE2C"/>
      <stop offset="1" stop-color="#A87016"/>
    </linearGradient>
  </defs>
  <g>
    <!-- polished band: dark outer rim, gradient body, dark inner rim -->
    <circle cx="256" cy="256" r="219.5" stroke="#7A4E0B" stroke-width="4" opacity=".55"/>
    <circle cx="256" cy="256" r="206" stroke="url(#band)" stroke-width="30"/>
    <circle cx="256" cy="256" r="192.5" stroke="#7A4E0B" stroke-width="3.5" opacity=".4"/>
    <circle cx="256" cy="256" r="213.2" stroke="#7A4E0B" stroke-width="2.5" opacity=".3"/>
    <!-- gloss: one long arc upper-left, one short arc lower-right -->
    <path d="M 63.75 200.87 A 200 200 0 0 1 235.09 57.1" stroke="#FFF9E0" stroke-width="10.2" stroke-linecap="round" opacity=".8"/>
    <path d="M 453.12 335.64 A 212.6 212.6 0 0 1 368.66 436.3" stroke="#FFF9E0" stroke-width="6" stroke-linecap="round" opacity=".4"/>
    <!-- foot accent: ONE bezel medallion at 6 o'clock; see the ornament rule above -->
    <ellipse cx="256" cy="471" rx="28" ry="19" fill="url(#mount)" stroke="#7A4E0B" stroke-width="4"/>
    <path d="M 238.1 466.61 A 19.04 12.92 0 0 1 252.76 458.21" stroke="#FFF9E0" stroke-width="3.8" stroke-linecap="round" fill="none" opacity=".7"/>
    <g transform="translate(256 471)"><path d="M 0 -12.16 L 12.32 0 L 0 12.16 L -12.32 0 Z" fill="#FFDA72" stroke="#8F5E10" stroke-width="2.5" stroke-linejoin="round"/><path d="M 0 -12.16 L 12.32 0 L 0 0 Z" fill="#FFF7D4" opacity=".9"/><path d="M 0 12.16 L -12.32 0 L 0 0 Z" fill="#9C6A10" opacity=".5"/></g>
  </g>
</svg>
