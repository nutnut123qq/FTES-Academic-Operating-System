name: test

# `npm run test` is NOT part of `next build`, so the Vercel check stays green on a
# red suite — that is how PR #129's five failures and three collect-time deaths
# survived for days. This job is the gate that actually reads them.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `npm install`, NOT `npm ci`: package-lock.json is generated on Windows and
      # npm omits the other platforms' optional binaries from it (npm/cli#4828), so
      # `npm ci` on linux lands without @rollup/rollup-linux-x64-gnu and vitest dies
      # at startup. `install` resolves the host's binary. Lockfile drift is caught by
      # the Vercel build, not here.
      - run: npm install --no-audit --no-fund
      - run: npm run test
