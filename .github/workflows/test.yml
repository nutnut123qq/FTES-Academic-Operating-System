name: test

# `npm run test` is NOT part of `next build`, so the Vercel check stays green on a
# red suite — that is how PR #129's five failures and three collect-time deaths
# survived for days. This job is the gate that actually reads them.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # package-lock.json is generated on Windows and carries ONLY the win32 native
      # binaries — npm never recorded the linux ones (npm/cli#4828), so neither
      # `npm ci` nor `npm install` can place them here and vite/rollup dies at
      # startup. Add them out-of-band at the exact versions npm ci just pinned, so
      # this keeps working across upgrades without touching the shared lockfile.
      - name: Add the linux native binaries the Windows lockfile omits
        run: |
          npm install --no-save --no-audit --no-fund \
            "@rollup/rollup-linux-x64-gnu@$(node -p 'require("rollup/package.json").version')" \
            "@esbuild/linux-x64@$(node -p 'require("esbuild/package.json").version')"
      - run: npm run test
